<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTT v2 — {% block title %}Dashboard{% endblock %}</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<style>
  :root {
    --bg:        #0d1117;
    --surface:   #161b22;
    --border:    #30363d;
    --text:      #e6edf3;
    --muted:     #8b949e;
    --green:     #3fb950;
    --red:       #f85149;
    --yellow:    #d29922;
    --blue:      #58a6ff;
    --accent:    #1f6feb;
    --font:      'Segoe UI', system-ui, sans-serif;
    --mono:      'Cascadia Code', 'Consolas', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; }

  /* Nav */
  .nav { background: var(--surface); border-bottom: 1px solid var(--border);
         display: flex; align-items: center; padding: 0 20px; height: 48px; gap: 4px; }
  .nav-brand { font-weight: 700; color: var(--blue); margin-right: 24px; font-size: 15px; white-space: nowrap; }
  .nav-brand span { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .nav a { color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 6px;
           font-size: 13px; transition: color .15s, background .15s; }
  .nav a:hover, .nav a.active { color: var(--text); background: rgba(255,255,255,.06); }
  .nav-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }

  /* Mode badge */
  .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px;
           font-family: var(--mono); letter-spacing: .5px; }
  .badge-demo { background: rgba(88,166,255,.15); color: var(--blue); border: 1px solid rgba(88,166,255,.3); }
  .badge-real { background: rgba(248,81,73,.15); color: var(--red);  border: 1px solid rgba(248,81,73,.3); }

  /* Trading toggle */
  .trade-btn { padding: 5px 14px; border-radius: 6px; border: none; cursor: pointer;
               font-size: 12px; font-weight: 600; transition: all .15s; }
  .trade-btn.on  { background: rgba(63,185,80,.2);  color: var(--green); border: 1px solid rgba(63,185,80,.4); }
  .trade-btn.off { background: rgba(139,148,158,.1); color: var(--muted); border: 1px solid var(--border); }

  /* Main layout */
  .page { padding: 20px; max-width: 1400px; margin: 0 auto; }
  .page-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: var(--text); }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
          padding: 16px; margin-bottom: 16px; }
  .card-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase;
                letter-spacing: .6px; margin-bottom: 12px; }

  /* Tables */
  table { width: 100%; border-collapse: collapse; }
  th { font-size: 11px; color: var(--muted); font-weight: 600; text-align: left;
       padding: 6px 12px; border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: .4px; }
  td { padding: 8px 12px; border-bottom: 1px solid rgba(48,54,61,.5); font-size: 13px; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,.02); }

  /* Colors */
  .green { color: var(--green); }
  .red   { color: var(--red); }
  .muted { color: var(--muted); }
  .blue  { color: var(--blue); }
  .mono  { font-family: var(--mono); }

  /* Buttons */
  .btn { padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer;
         font-size: 12px; font-weight: 600; transition: all .15s; }
  .btn-green  { background: rgba(63,185,80,.2);  color: var(--green); border: 1px solid rgba(63,185,80,.4); }
  .btn-red    { background: rgba(248,81,73,.2);  color: var(--red);   border: 1px solid rgba(248,81,73,.4); }
  .btn-blue   { background: rgba(88,166,255,.15);color: var(--blue);  border: 1px solid rgba(88,166,255,.3); }
  .btn-muted  { background: rgba(139,148,158,.1);color: var(--muted); border: 1px solid var(--border); }
  .btn:hover  { filter: brightness(1.2); }
  .btn:disabled { opacity: .4; cursor: default; }

  /* Grid */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

  /* Stat pill */
  .stat { text-align: center; }
  .stat-val  { font-size: 22px; font-weight: 700; font-family: var(--mono); }
  .stat-label{ font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* Signal dot */
  .sig-buy  { color: var(--green); font-weight: 700; }
  .sig-sell { color: var(--red);   font-weight: 700; }
  .sig-hold { color: var(--muted); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* Toast */
  #toast { position: fixed; bottom: 24px; right: 24px; padding: 10px 18px;
           background: var(--surface); border: 1px solid var(--border);
           border-radius: 8px; font-size: 13px; opacity: 0;
           transition: opacity .3s; z-index: 9999; pointer-events: none; }
  #toast.show { opacity: 1; }
</style>
{% block extra_head %}{% endblock %}
</head>
<body>

<nav class="nav">
  <div class="nav-brand">HTT <span>v2.0</span></div>
  <a href="/"         class="{% if request.path == '/' %}active{% endif %}">Анализ</a>
  <a href="/positions"class="{% if request.path == '/positions' %}active{% endif %}">Позиции</a>
  <a href="/history"  class="{% if request.path == '/history' %}active{% endif %}">История</a>
  <a href="/balances" class="{% if request.path == '/balances' %}active{% endif %}">Баланс</a>
  <a href="/settings" class="{% if request.path == '/settings' %}active{% endif %}">Настройки</a>
  <div class="nav-right">
    <span id="balance-nav" class="mono" style="font-size:13px;color:var(--text)">—</span>
    <span id="mode-badge" class="badge {% if data.mode == 'REAL' %}badge-real{% else %}badge-demo{% endif %}">
      {{ data.mode }}
    </span>
    <button id="trade-toggle" class="trade-btn {% if data.trading_allowed %}on{% else %}off{% endif %}"
            onclick="toggleTrading()">
      {% if data.trading_allowed %}▶ Торговля ВКЛ{% else %}⏸ Торговля ВЫКЛ{% endif %}
    </button>
  </div>
</nav>

<div id="toast"></div>

{% block content %}{% endblock %}

<script>
  // WebSocket
  const socket = io();
  socket.on('update', data => window._state = data);

  // Toast
  function toast(msg, ok=true) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.borderColor = ok ? 'var(--green)' : 'var(--red)';
    t.style.color = ok ? 'var(--green)' : 'var(--red)';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // Toggle trading
  function toggleTrading() {
    fetch('/api/toggle_trading', {method:'POST'})
      .then(r=>r.json()).then(d=>{
        const btn = document.getElementById('trade-toggle');
        if(d.trading_allowed){
          btn.textContent='▶ Торговля ВКЛ'; btn.className='trade-btn on';
        } else {
          btn.textContent='⏸ Торговля ВЫКЛ'; btn.className='trade-btn off';
        }
        toast(d.trading_allowed ? 'Торговля включена' : 'Торговля выключена');
      });
  }

  // Update balance in nav
  socket.on('update', d => {
    const el = document.getElementById('balance-nav');
    if(el && d.balances && d.balances.total_usdt)
      el.textContent = parseFloat(d.balances.total_usdt).toFixed(2) + ' USDT';
  });
</script>

{% block scripts %}{% endblock %}
</body>
</html>
